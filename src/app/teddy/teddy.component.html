<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Hug</title>
</head>
<body>
    <div class="container">
        <h1>Sending You a Big Hug! 🤗</h1>
        <img src="../../assets/teddyHug.gif" class="hug-img" [ngClass]="{ 'hugging': isHugging }" />
        <br />
        <button class="btn" (click)="sendHug()">Send a Virtual Hug</button>
        <p class="message">{{ message }}</p>
    </div>
</body>
</html>
